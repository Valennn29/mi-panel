<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F2F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0F12" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Panel">
<meta name="color-scheme" content="light dark">
<title>Mi Panel</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
/* ============ Tokens ============ */
:root{
  --bg:#EAEDF1; --surface:#FFFFFF; --surface2:#F3F5F8; --ink:#0D0F13; --ink2:#434B56; --line:#D5DAE1;
  --accent:#2C7E89; --accent-ink:#FFFFFF; --accent-soft:#E2F0F1; --warn:#9A5A08; --warn-soft:#FBF0DC;
  --danger:#B3261E; --danger-soft:#FCE9E7; --ok:#1B7448; --ok-soft:#E1F3E9;
  --shadow:0 1px 2px rgba(20,24,30,.05),0 6px 18px rgba(20,24,30,.07);
  --r-lg:22px; --r-md:16px; --r-sm:11px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --vvh:100dvh;
}
:root[data-theme="dark"]{
  --bg:#0D0F12; --surface:#171A1F; --surface2:#1F232A; --ink:#F2F3F5; --ink2:#A6ADB8; --line:#2A2F37;
  --accent:#66B9C2; --accent-ink:#06272A; --accent-soft:#16363A; --warn:#E5A84B; --warn-soft:#3A2D14;
  --danger:#FF8B82; --danger-soft:#3D1F1D; --ok:#69D29B; --ok-soft:#173226;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark){
  :root[data-theme="system"]{
    --bg:#0D0F12; --surface:#171A1F; --surface2:#1F232A; --ink:#F2F3F5; --ink2:#A6ADB8; --line:#2A2F37;
    --accent:#66B9C2; --accent-ink:#06272A; --accent-soft:#16363A; --warn:#E5A84B; --warn-soft:#3A2D14;
    --danger:#FF8B82; --danger-soft:#3D1F1D; --ok:#69D29B; --ok-soft:#173226;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
  }
}
/* ============ Base ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  overflow-x:hidden}
body{min-height:100vh;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,p{margin:0}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#view{position:relative;z-index:1;padding:calc(var(--sat) + 14px) calc(var(--sal) + 16px) calc(170px + var(--sab)) calc(var(--sar) + 16px);
  max-width:640px;margin:0 auto}
/* ============ Tipografía ============ */
.title{font-size:30px;line-height:1.1;font-weight:760;letter-spacing:-.02em}
.hero{font-size:27px;line-height:1.18;font-weight:720;letter-spacing:-.02em;text-wrap:balance}
.hero b{font-weight:760;color:var(--accent)}
.h2{font-size:19px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--ink2);font-size:14px}
.small{font-size:13px;color:var(--ink2)}
.big{font-size:26px;font-weight:720;letter-spacing:-.02em}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:12px}
.stack-lg>*+*{margin-top:20px}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{flex-wrap:wrap}
/* ============ Header ============ */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 16px}
.back{min-height:44px;min-width:44px;display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:600;margin-bottom:2px}
/* ============ Tarjetas ============ */
.card{background:var(--surface);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
.card.tap{display:block;width:100%;text-align:left}
.card.tap.row{display:flex}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.card h3{font-size:15px;color:var(--ink2);font-weight:600;margin-bottom:6px}
.list{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;width:100%;text-align:left}
.item+.item{border-top:1px solid var(--line)}
button.item:active,a.item:active{background:var(--surface2)}
.item .t{font-weight:600}
.item .m{font-size:13px;color:var(--ink2)}
.chev::after{content:"›";color:var(--ink2);font-size:22px;margin-left:4px}

/* ============ Inicio: materiales translúcidos (estilo Apple) ============ */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(60% 38% at 12% 6%,rgba(31,111,120,.30),transparent 70%),
   radial-gradient(50% 34% at 92% 22%,rgba(88,130,230,.13),transparent 70%),
   radial-gradient(55% 36% at 30% 62%,rgba(244,170,120,.20),transparent 72%),
   radial-gradient(60% 40% at 90% 92%,rgba(31,111,120,.20),transparent 70%)}
:root[data-theme="dark"] .ambient{background:
   radial-gradient(60% 38% at 12% 6%,rgba(92,194,204,.26),transparent 70%),
   radial-gradient(50% 34% at 92% 22%,rgba(96,120,255,.24),transparent 70%),
   radial-gradient(55% 36% at 30% 62%,rgba(255,150,110,.14),transparent 72%),
   radial-gradient(60% 40% at 90% 92%,rgba(92,194,204,.16),transparent 70%)}
@media (prefers-color-scheme: dark){:root[data-theme="system"] .ambient{background:
   radial-gradient(60% 38% at 12% 6%,rgba(92,194,204,.26),transparent 70%),
   radial-gradient(50% 34% at 92% 22%,rgba(96,120,255,.24),transparent 70%),
   radial-gradient(55% 36% at 30% 62%,rgba(255,150,110,.14),transparent 72%),
   radial-gradient(60% 40% at 90% 92%,rgba(92,194,204,.16),transparent 70%)}}
.gl{background:color-mix(in srgb,var(--surface) 62%,transparent);
  -webkit-backdrop-filter:saturate(1.8) blur(26px);backdrop-filter:saturate(1.8) blur(26px);
  border:1px solid rgba(255,255,255,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 1px 2px rgba(20,24,30,.05),0 10px 30px rgba(20,24,30,.08)}
:root[data-theme="dark"] .gl{border-color:rgba(255,255,255,.09);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 10px 30px rgba(0,0,0,.35)}
@media (prefers-color-scheme: dark){:root[data-theme="system"] .gl{border-color:rgba(255,255,255,.09);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 10px 30px rgba(0,0,0,.35)}}
.btn.glb{background:color-mix(in srgb,var(--surface) 55%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.gl,.btn.glb{background:var(--surface)}}
@media (prefers-reduced-transparency: reduce){.gl,.btn.glb{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}.ambient{display:none}}
@media (prefers-contrast: more){.gl{border-color:var(--ink2)}}
/* respuesta inmediata al toque (al presionar, no al soltar) */
.card.tap,.btn,.seg button{transition:transform .28s cubic-bezier(.22,1,.36,1)}
.card.tap:active,.btn:active{transform:scale(.975);transition-duration:.08s}
.hero.big{font-size:clamp(2.1rem,9vw,2.6rem);line-height:1.04;letter-spacing:-.03em;font-weight:780;margin-bottom:8px}
.phrase{font-size:17px;line-height:1.38;color:var(--ink2);margin-bottom:16px;text-wrap:balance;max-width:34ch}
.today .next{margin-top:14px;justify-content:flex-start;text-align:left;white-space:normal;padding:12px 18px;line-height:1.25}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .bg{stroke:color-mix(in srgb,var(--ink) 11%,transparent)}
.ring .v{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:calc(100 - var(--p))}
.anim .ring .v{animation:ringin 1s cubic-bezier(.22,1,.36,1) .25s both}
.ring .v.zero{opacity:0}
.ring .mid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:19px}
@keyframes ringin{from{stroke-dashoffset:100}}
.goal{padding:10px 0}.goal+.goal{border-top:1px solid color-mix(in srgb,var(--ink) 9%,transparent)}
.pbar{height:9px;border-radius:9px;background:color-mix(in srgb,var(--ink) 11%,transparent);overflow:hidden;margin:8px 0 6px}
.pbar i{display:block;height:100%;width:100%;border-radius:9px;background:var(--accent);transform-origin:left;transform:scaleX(var(--p))}
.anim .pbar i{animation:barin .9s cubic-bezier(.22,1,.36,1) .3s both}
@keyframes barin{from{transform:scaleX(0)}}
.chip.streak{background:var(--warn-soft);color:var(--warn);font-weight:650}
/* vibrancy: sobre vidrio, texto secundario más firme y con tracking apenas abierto; superficie grande = material más grueso */
.gl h3,.gl .sub,.gl .small{color:color-mix(in srgb,var(--ink) 72%,transparent);font-weight:560;letter-spacing:.005em}
.gl.today{-webkit-backdrop-filter:saturate(1.9) blur(34px);backdrop-filter:saturate(1.9) blur(34px);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 2px 4px rgba(20,24,30,.05),0 18px 44px rgba(20,24,30,.12)}
@media (prefers-reduced-motion: reduce){.ring .v,.pbar i{animation:none}.ring .v,.pbar i{transition:opacity .2s ease}.card.tap,.btn{transition:none}}
/* ============ Botones y controles ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:14px;
  font-weight:650;background:var(--accent);color:var(--accent-ink);text-align:center}
.btn.sec{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--accent);padding:0 10px}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{min-height:44px;padding:0 14px;font-size:15px}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2)}
.seg{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:3px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;min-height:44px;min-width:44px;padding:0 12px;border-radius:11px;font-weight:600;font-size:14.5px;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:26px;padding:0 9px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.demo{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.check{flex:0 0 auto;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;margin:-8px -8px -8px -10px}
.check i{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink2);display:block;position:relative}
.check[aria-checked="true"] i{background:var(--accent);border-color:var(--accent)}
.check[aria-checked="true"] i::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.done .t{text-decoration:line-through;color:var(--ink2)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ink2);flex:0 0 auto}
.dot.alta{background:var(--danger)} .dot.normal{background:var(--accent)} .dot.baja{background:var(--line)}
/* ============ Formularios ============ */
.field{display:block}
.field>span{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:0 2px 5px}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=time],input[type=url],input[type=month],select,textarea{
  width:100%;min-height:48px;padding:11px 13px;border-radius:13px;border:1px solid var(--line);background:var(--surface2);font-size:16px}
textarea{min-height:84px;resize:vertical}
input[type=range]{width:100%;min-height:44px;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
details.more{border-top:1px solid var(--line);padding-top:6px}
details.more summary{min-height:44px;display:flex;align-items:center;color:var(--accent);font-weight:600;cursor:pointer}
.tog{display:flex;align-items:center;gap:12px;min-height:48px}
.tog input{width:24px;height:24px;accent-color:var(--accent)}
/* ============ Barra inferior y FAB (glass) ============ */
.glass{background:color-mix(in srgb,var(--surface) 82%,transparent);
  -webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);
  border:1px solid color-mix(in srgb,var(--line) 80%,transparent);box-shadow:var(--shadow)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--surface)}}
#tabbar{position:fixed;z-index:20;left:calc(var(--sal) + 12px);right:calc(var(--sar) + 12px);bottom:calc(var(--sab) + 10px);
  max-width:616px;margin:0 auto;border-radius:26px;display:flex;padding:5px}
#tabbar button{flex:1;min-height:56px;border-radius:21px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:11px;font-weight:650;color:var(--ink2)}
#tabbar button svg{width:24px;height:24px}
#tabbar button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
#fab{position:fixed;z-index:21;right:calc(var(--sar) + 18px);bottom:calc(var(--sab) + 88px);width:56px;height:56px;border-radius:50%;
  background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(0,0,0,.28)}
#fab svg{width:28px;height:28px}
@media (min-width:700px){#fab{right:calc(50% - 300px)}}
body.sheet-open #fab,body.sheet-open #tabbar{visibility:hidden}
/* ============ Sheet ============ */
#sheet-root{position:fixed;inset:0;z-index:50;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(10,12,15,.45);opacity:0;transition:opacity .18s;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;background:var(--surface);
  border-radius:26px 26px 0 0;max-height:calc(var(--vvh) * .94);display:flex;flex-direction:column;pointer-events:auto;
  transform:translateY(24px);opacity:0;transition:transform .2s,opacity .2s}
.sheet.in{transform:none;opacity:1}.scrim.in{opacity:1}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:12px 8px 6px 20px}
.sheet header h2{font-size:19px;font-weight:720}
.sheet .body{overflow:auto;-webkit-overflow-scrolling:touch;padding:6px 20px calc(24px + var(--sab));overscroll-behavior:contain}
/* ============ Toast / banners ============ */
#toast{position:fixed;z-index:60;left:16px;right:16px;bottom:calc(var(--sab) + 160px);max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between;box-shadow:var(--shadow)}
.toast button{color:var(--accent);font-weight:700;min-height:44px;padding:0 6px;filter:brightness(1.4)}
.banner{border-radius:var(--r-md);padding:12px 14px;font-size:14px;margin-bottom:12px;background:var(--warn-soft);color:var(--warn)}
.banner.bad{background:var(--danger-soft);color:var(--danger)}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.banner b{font-weight:700}
.banner .btn{margin-top:8px}
.empty{text-align:center;padding:26px 16px;color:var(--ink2)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.empty .btn{margin-top:12px}
/* ============ Calendario ============ */
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.month .dow{font-size:12px;color:var(--ink2);font-weight:600;padding:4px 0}
.month button{min-height:48px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:600;font-size:15px}
.month button.out{color:var(--ink2);opacity:.55}
.month button.today{outline:2px solid var(--accent);outline-offset:-2px}
.month button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.month .dots{display:flex;gap:3px;height:6px}
.month .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.month .dots i.app{background:var(--warn)}
button[aria-pressed="true"] .dots i{background:var(--accent-ink)}
.ev{display:flex;gap:12px;padding:12px 14px;align-items:flex-start;width:100%;text-align:left}
.ev+.ev{border-top:1px solid var(--line)}
.ev .time{flex:0 0 58px;font-size:13px;color:var(--ink2);font-weight:600;padding-top:2px}
.ev .bar{flex:0 0 4px;align-self:stretch;border-radius:4px;background:var(--accent)}
.ev.app .bar{background:var(--warn)}
.daylabel{font-size:13px;font-weight:700;color:var(--ink2);margin:16px 4px 6px}
/* ============ Gráficos ============ */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink2);font-size:11px;font-family:inherit}
.chart .ln{stroke:var(--accent);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart .pt{fill:var(--accent)}
.chart .gr{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--accent)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 0}
.kv+.kv{border-top:1px solid var(--line)}
.kv .k{color:var(--ink2)}
.kv.tot{font-weight:700}
.link{min-width:44px;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:44px;display:inline-flex;align-items:center}
.amount-btn{font-weight:700;text-decoration:underline dotted;text-underline-offset:4px;min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:flex-end}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (orientation:landscape) and (max-height:500px){#view{padding-bottom:calc(120px + var(--sab))} #fab{bottom:calc(var(--sab) + 80px)}}

/* ============ Rediseño global 1.2: contraste + materiales translúcidos (principios de Apple) ============ */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none}
.card,.list,.seg,.sheet{background:color-mix(in srgb,var(--surface) 70%,transparent);
  -webkit-backdrop-filter:saturate(1.8) blur(26px);backdrop-filter:saturate(1.8) blur(26px);
  border:1px solid rgba(255,255,255,.6);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 1px 2px rgba(14,18,24,.06),0 12px 32px rgba(14,18,24,.10)}
:root[data-theme="dark"] .card,:root[data-theme="dark"] .list,:root[data-theme="dark"] .seg,:root[data-theme="dark"] .sheet{border-color:rgba(255,255,255,.10);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 12px 32px rgba(0,0,0,.40)}
@media (prefers-color-scheme: dark){:root[data-theme="system"] .card,:root[data-theme="system"] .list,:root[data-theme="system"] .seg,:root[data-theme="system"] .sheet{border-color:rgba(255,255,255,.10);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 12px 32px rgba(0,0,0,.40)}}
.card.flat{background:color-mix(in srgb,var(--surface) 45%,transparent);box-shadow:none;border:1px solid var(--line)}
.list .item+.item,.item+.item{border-top:1px solid color-mix(in srgb,var(--ink) 10%,transparent)}
.list,.card .list{overflow:hidden}
.card .list{background:transparent;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.seg{padding:4px;border-radius:16px}

<body>
<div class="ambient" aria-hidden="true"></div>
<div id="app">
  <main id="view" tabindex="-1" aria-live="polite"></main>
  <button id="fab" class="glass" aria-label="Agregar algo nuevo" style="background:var(--accent);color:var(--accent-ink);border:0">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <nav id="tabbar" class="glass" aria-label="Navegación principal"></nav>
</div>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>Mi Panel necesita JavaScript para funcionar.</noscript>
<script src="config.js" onerror="void 0"></script>
<script>
'use strict';
/* =====================================================================
   MI PANEL — app personal local-first (PWA para iPhone)
   Módulos internos: Core (fechas, dinero, feriados) · DB · Data · Fin · Train
   · GCal · UI · Vistas. Todo en un solo archivo para que abra con doble clic;
   manifest.webmanifest, sw.js y config.js van aparte porque el navegador los pide así.
   ===================================================================== */
(() => {
const APP_VERSION = '1.3.0';
const SCHEMA_VERSION = 1;
const MP = (window.MP = { version: APP_VERSION });
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

/* ---------- HTML seguro: todo valor interpolado se escapa salvo que sea Raw ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
class Raw { constructor(s) { this.s = s; } }
const raw = s => new Raw(s);
function html(strings, ...vals) {
  let out = '';
  strings.forEach((s, i) => {
    out += s;
    if (i < vals.length) {
      const v = vals[i];
      if (Array.isArray(v)) out += v.map(x => (x instanceof Raw ? x.s : esc(x))).join('');
      else out += v instanceof Raw ? v.s : esc(v);
    }
  });
  return new Raw(out);
}
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const nowIso = () => new Date().toISOString();

/* =====================================================================
   CORE — fechas (cadenas AAAA-MM-DD, aritmética en UTC: sin errores de huso)
   ===================================================================== */
const D = {
  parse(s) { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); },
  fmt(dt) { return dt.toISOString().slice(0, 10); },
  add(s, n) { const dt = D.parse(s); dt.setUTCDate(dt.getUTCDate() + n); return D.fmt(dt); },
  dow(s) { return D.parse(s).getUTCDay(); }, // 0 = domingo
  dim(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }, // m = 1..12
  ym(s) { return s.slice(0, 7); },
  diff(a, b) { return Math.round((D.parse(b) - D.parse(a)) / 864e5); }, // b - a
  addMonths(ym, n) { let [y, m] = ym.split('-').map(Number); m += n; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return y + '-' + String(m).padStart(2, '0'); },
  monthsBetween(a, b) { const [ya, ma] = a.split('-').map(Number), [yb, mb] = b.split('-').map(Number); return (yb - ya) * 12 + (mb - ma); },
  clampDay(ym, day) { const [y, m] = ym.split('-').map(Number); return ym + '-' + String(Math.min(day, D.dim(y, m))).padStart(2, '0'); },
  startOfWeek(s) { const w = D.dow(s); return D.add(s, -((w + 6) % 7)); }, // semana desde lunes
};
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const DIAS3 = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmtDate = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : '';
const fmtDateShort = s => `${DIAS3[D.dow(s)]} ${+s.slice(8, 10)} ${MESES[+s.slice(5, 7) - 1].slice(0, 3)}`;
const fmtYM = ym => cap(MESES[+ym.slice(5, 7) - 1]) + ' ' + ym.slice(0, 4);

/* Hora local en la zona configurada (la zona inicial es America/Argentina/Buenos_Aires) */
function tzParts(date = new Date(), tz = (S.settings && S.settings.tz) || 'America/Argentina/Buenos_Aires') {
  const p = {};
  new Intl.DateTimeFormat('en-CA', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
    .formatToParts(date).forEach(x => { p[x.type] = x.value; });
  return p;
}
const today = () => { const p = tzParts(); return `${p.year}-${p.month}-${p.day}`; };
const nowHM = () => { const p = tzParts(); return `${p.hour}:${p.minute}`; };
/* Desfase UTC de una zona en una fecha dada, para armar ISO con offset (Argentina: -03:00, sin DST) */
function tzOffsetStr(dateStr, tz) {
  const dt = new Date(dateStr + 'T12:00:00Z');
  const parts = new Intl.DateTimeFormat('en-US', { timeZone: tz, timeZoneName: 'longOffset' }).formatToParts(dt);
  const n = (parts.find(p => p.type === 'timeZoneName') || {}).value || 'GMT';
  const m = /GMT([+-]\d{2}):?(\d{2})?/.exec(n);
  return m ? m[1] + ':' + (m[2] || '00') : '+00:00';
}

/* =====================================================================
   CORE — dinero: enteros en centavos + código de moneda. Sin flotantes.
   ===================================================================== */
const Money = {
  /* "1.234,56" · "1234,5" · "1234.56" · "$ 1.500" → centavos (entero) o null si no es válido */
  parse(input) {
    let s = String(input ?? '').trim().replace(/[\s$]|US|ARS|USD/gi, '');
    if (!s) return null;
    const hasC = s.includes(','), hasD = s.includes('.');
    if (hasC && hasD) {
      const dec = s.lastIndexOf(',') > s.lastIndexOf('.') ? ',' : '.';
      const th = dec === ',' ? '.' : ',';
      s = s.split(th).join('').replace(dec, '.');
    } else if (hasC) {
      if ((s.match(/,/g) || []).length > 1) s = s.split(',').join('');
      else s = s.replace(',', '.');
    } else if (hasD) {
      if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.split('.').join('');
    }
    if (!/^\d+(\.\d{1,2})?$/.test(s)) return null;
    const [i, f = ''] = s.split('.');
    const cents = Number(i) * 100 + Number((f + '00').slice(0, 2));
    return Number.isSafeInteger(cents) ? cents : null;
  },
  fmt(cents, cur = 'ARS', opts = {}) {
    if (cents == null) return '—';
    const whole = cents % 100 === 0 && !opts.cents;
    const nf = new Intl.NumberFormat('es-AR', { style: 'currency', currency: cur, currencyDisplay: cur === 'USD' ? 'code' : 'narrowSymbol', minimumFractionDigits: whole ? 0 : 2, maximumFractionDigits: whole ? 0 : 2 });
    return nf.format(cents / 100).replace(/ /g, ' ').replace('USD ', 'US$ ');
  },
  toInput(cents) { return cents == null ? '' : (cents / 100).toFixed(2).replace('.', ',').replace(/,00$/, ''); },
  /* USD→ARS con tipo de cambio manual (centavos de ARS por 1 USD). BigInt: exacto. */
  usdToArs(usdCents, rateCents) { return Number((BigInt(usdCents) * BigInt(rateCents) + 50n) / 100n); },
  /* meta de ahorro = ingresos × % (entero, redondeo half-up) */
  pctOf(cents, pct) { return Math.floor((cents * pct + 50) / 100); },
  sum(arr) { return arr.reduce((a, b) => a + (b || 0), 0); },
};

/* =====================================================================
   CORE — días hábiles bancarios y fechas de cobro
   ===================================================================== */
function holidaySet() {
  const set = new Set();
  (S.holidays || []).forEach(h => (h.dates || []).forEach(x => set.add(x.date)));
  return set;
}
const yearLoaded = y => (S.holidays || []).some(h => String(h.year) === String(y) && h.loaded);
const isBizDay = (s, hs) => { const w = D.dow(s); return w !== 0 && w !== 6 && !hs.has(s); };
/* Principal: último día del mes y retroceder hasta día hábil bancario anterior o igual */
function lastBizDay(ym, hs = holidaySet()) {
  const [y, m] = ym.split('-').map(Number);
  let s = `${ym}-${String(D.dim(y, m)).padStart(2, '0')}`;
  while (!isBizDay(s, hs)) s = D.add(s, -1);
  return s;
}
/* Secundario: día 15 y avanzar hasta el primer día hábil bancario igual o posterior */
function day15Biz(ym, hs = holidaySet()) {
  let s = `${ym}-15`;
  while (!isBizDay(s, hs)) s = D.add(s, 1);
  return s;
}
/* Fecha de cobro de una regla en un mes + si el cálculo es provisorio (año sin feriados cargados) */
function payDate(rule, ym, hs = holidaySet()) {
  const date = rule.kind === 'lastBiz' ? lastBizDay(ym, hs) : day15Biz(ym, hs);
  const years = new Set([ym.slice(0, 4), date.slice(0, 4)]);
  const provisional = [...years].some(y => !yearLoaded(y));
  return { date, provisional };
}

Object.assign(MP, { core: { D, Money, lastBizDay, day15Biz, isBizDay, payDate, esc, html, fmtDate } });


/* =====================================================================
   DB — IndexedDB (almacenamiento principal) + espejo en memoria (única fuente de verdad)
   Esquema versionado: DB_VERSION sube cuando cambian los stores; SCHEMA_VERSION
   versiona el contenido (se guarda en ajustes y en cada respaldo).
   ===================================================================== */
const DB_NAME = 'mi-panel', DB_VERSION = 1;
const STORES = ['tasks', 'lists', 'listItems', 'exercises', 'plan', 'sessions', 'weights', 'incomes', 'expenses', 'subs', 'savings', 'holidays', 'settings', 'gcache'];
const BACKUP_STORES = STORES.filter(s => s !== 'gcache'); // el caché de Google no entra en respaldos
let S = { storageOk: true };
STORES.forEach(s => { S[s] = []; });

const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('IndexedDB no disponible'));
      const rq = indexedDB.open(DB_NAME, DB_VERSION);
      rq.onupgradeneeded = e => {
        const db = rq.result;
        /* Migraciones: cada bloque lleva de versión N a N+1 sin borrar stores existentes. */
        if (e.oldVersion < 1) STORES.forEach(s => db.createObjectStore(s, { keyPath: 'id' }));
      };
      rq.onsuccess = () => { DB.db = rq.result; res(); };
      rq.onerror = () => rej(rq.error);
      rq.onblocked = () => rej(new Error('Base bloqueada por otra pestaña'));
    });
  },
  tx(stores, mode = 'readonly') { return DB.db.transaction(stores, mode); },
  all(store) {
    return new Promise((res, rej) => { const r = DB.tx(store).objectStore(store).getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  },
  put(store, obj) {
    return new Promise((res, rej) => { const t = DB.tx(store, 'readwrite'); t.objectStore(store).put(obj); t.oncomplete = res; t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
  },
  del(store, id) {
    return new Promise((res, rej) => { const t = DB.tx(store, 'readwrite'); t.objectStore(store).delete(id); t.oncomplete = res; t.onerror = () => rej(t.error); });
  },
  /* Reemplazo total atómico (restauración / borrado total): todo o nada */
  replaceAll(map, storeList = STORES) {
    return new Promise((res, rej) => {
      const t = DB.tx(storeList, 'readwrite');
      storeList.forEach(s => { const os = t.objectStore(s); os.clear(); (map[s] || []).forEach(o => os.put(o)); });
      t.oncomplete = res; t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
};

const DEFAULT_SETTINGS = () => ({
  id: 'main', schemaVersion: SCHEMA_VERSION,
  theme: 'system', tz: 'America/Argentina/Buenos_Aires', baseCurrency: 'ARS', unit: 'kg',
  savingsPct: 10, savingsPaused: false, savingsOverrides: {},
  cardMode: 'simple', subsCountAnyway: false,
  fx: null, // { rateCents, date, ref }
  taskCategories: ['Personal', 'Trabajo', 'Casa', 'Salud'],
  expenseCategories: ['Alquiler', 'Tarjeta de crédito', 'Suscripciones', 'Servicios e impuestos', 'Supermercado', 'Transporte', 'Salud y entrenamiento', 'Compras y otros'],
  paymentMethods: [{ name: 'Tarjeta de crédito', type: 'tarjeta' }, { name: 'Débito / transferencia', type: 'otro' }, { name: 'Efectivo', type: 'otro' }],
  incomeRules: [
    { id: 'main', label: 'Ingreso principal', kind: 'lastBiz', expectedCents: null, currency: 'ARS', enabled: true },
    { id: 'secondary', label: 'Ingreso secundario', kind: 'day15', expectedCents: null, currency: 'ARS', enabled: true },
  ],
  userName: 'Valen', weeklyTrainGoal: 3, // nombre y objetivo editables en Ajustes
  homeWidgets: { event: true, tasks: true, training: true, birthday: true, paydays: true, finance: true },
  birthdayWindow: 60, birthdayIncludeOwn: false, bdayConfirmed: [], bdayIgnored: [],
  gClientId: '', gLastSync: null, gAccount: null, gEverConnected: false,
  bdayReminders: { days: 1, time: '09:00', applied: {} }, // applied: { masterId: { prev, at } }
  cobroLinks: {}, cobroSyncedAt: null,
  demoLoaded: false, lastBackupAt: null, sessionDraft: null, trainPeriod: 90,
});

/* Feriados bancarios 2026 publicados por el BCRA (semilla editable; NO se reutiliza para otros años) */
const SEED_2026 = ['2026-01-01', '2026-02-16', '2026-02-17', '2026-03-23', '2026-03-24', '2026-04-02', '2026-04-03', '2026-05-01', '2026-05-25', '2026-06-15', '2026-07-09', '2026-07-10', '2026-08-17', '2026-10-12', '2026-11-09', '2026-11-10', '2026-11-23', '2026-12-07', '2026-12-08', '2026-12-25'];
const BCRA_URL = 'https://www.bcra.gob.ar/consulta-feriados-bancarios-2026/';
const seedHoliday2026 = () => ({ id: '2026', year: 2026, loaded: true, source: BCRA_URL, updatedAt: '2026-11-15', dates: SEED_2026.map(date => ({ date, desc: 'Feriado bancario (BCRA)' })) });

const Data = {
  async init() {
    try {
      await DB.open();
      for (const s of STORES) S[s] = await DB.all(s);
      const main = S.settings.find(x => x.id === 'main');
      S.settings = Object.assign(DEFAULT_SETTINGS(), main || {});
      if (!main) await DB.put('settings', S.settings);
      if (!S.holidays.length) { const h = seedHoliday2026(); S.holidays = [h]; await DB.put('holidays', h); }
      const cache = S.gcache.find(x => x.id === 'events');
      S.gevents = cache ? cache.events : [];
      S.gcacheMeta = cache ? { from: cache.from, to: cache.to, at: cache.at } : null;
    } catch (e) {
      console.warn('Almacenamiento local no disponible:', e && e.message);
      S.storageOk = false;
      STORES.forEach(s => { if (!Array.isArray(S[s])) S[s] = []; });
      S.settings = DEFAULT_SETTINGS(); S.holidays = [seedHoliday2026()]; S.gevents = []; S.gcacheMeta = null;
    }
  },
  /* Guarda en IndexedDB y en el espejo. Ante falla de disco avisa; nunca finge haber guardado. */
  async save(store, obj) {
    obj.updatedAt = nowIso(); if (!obj.createdAt) obj.createdAt = obj.updatedAt;
    if (store !== 'settings') { // ajustes vive como objeto único en S.settings
      const arr = S[store], i = arr.findIndex(x => x.id === obj.id);
      if (i >= 0) arr[i] = obj; else arr.push(obj);
    }
    if (S.storageOk) { try { await DB.put(store, obj); } catch (e) { UI.toast('No se pudo guardar en el dispositivo. Exportá un respaldo.'); console.warn('save error', e && e.name); } }
    return obj;
  },
  async remove(store, id) {
    S[store] = S[store].filter(x => x.id !== id);
    if (S.storageOk) { try { await DB.del(store, id); } catch (e) { console.warn('del error', e && e.name); } }
  },
  async saveSettings(patch) { Object.assign(S.settings, patch || {}); S.settings.id = 'main'; return Data.save('settings', S.settings); },
  find(store, id) { return S[store].find(x => x.id === id); },
};


/* =====================================================================
   FIN — reglas de negocio de finanzas (sin DOM). Todo en centavos enteros.
   ===================================================================== */
const Fin = {
  isCardMethod(name) { const m = S.settings.paymentMethods.find(x => x.name === name); return !!m && m.type === 'tarjeta'; },

  /* Instancias de gastos de un mes. Un gasto recurrente es una "plantilla"; lo pagado o ajustado
     de un mes concreto se guarda como override (templateId + ym) sin tocar los demás meses. */
  expenseInstances(ym) {
    const out = [];
    S.expenses.filter(e => !e.templateId && !e.archived).forEach(e => {
      const start = D.ym(e.dueDate), diff = D.monthsBetween(start, ym);
      let occurs = false;
      if (e.freq === 'unico') occurs = start === ym;
      else if (diff >= 0 && (!e.endYm || ym <= e.endYm)) {
        if (e.freq === 'mensual') occurs = true;
        else if (e.freq === 'anual') occurs = diff % 12 === 0;
        else if (e.freq === 'personalizada') occurs = diff % Math.max(1, e.everyMonths || 1) === 0;
      }
      if (!occurs) return;
      const ov = e.freq === 'unico' ? null : S.expenses.find(o => o.templateId === e.id && o.ym === ym);
      const date = ov && ov.dueDate ? ov.dueDate : (e.freq === 'unico' ? e.dueDate : D.clampDay(ym, +e.dueDate.slice(8, 10)));
      out.push({
        key: e.id + '|' + ym, base: e, ov, ym, desc: e.desc, currency: e.currency, category: e.category, method: e.method,
        amountCents: ov && ov.amountCents != null ? ov.amountCents : e.amountCents,
        status: ov ? ov.status : (e.freq === 'unico' ? e.status : 'previsto'),
        date, paidDate: ov ? ov.paidDate : (e.freq === 'unico' ? e.paidDate : null), recurring: e.freq !== 'unico',
      });
    });
    return out.sort((a, b) => a.date.localeCompare(b.date));
  },
  async setInstance(inst, patch) {
    if (!inst.recurring) { Object.assign(inst.base, patch); return Data.save('expenses', inst.base); }
    const ov = inst.ov || { id: uid(), templateId: inst.base.id, ym: inst.ym, status: 'previsto' };
    Object.assign(ov, patch);
    return Data.save('expenses', ov);
  },

  /* Cuándo cae una suscripción en un mes (mensual / trimestral / anual) */
  subCharge(sub, ym) {
    if (sub.status !== 'activa') return null;
    const start = D.ym(sub.dueDate), diff = D.monthsBetween(start, ym);
    if (diff < 0) return null;
    const step = sub.freq === 'anual' ? 12 : sub.freq === 'trimestral' ? 3 : 1;
    return diff % step === 0 ? D.clampDay(ym, +sub.dueDate.slice(8, 10)) : null;
  },
  /* Equivalente mensual en centavos (anual/12, trimestral/3), redondeo half-up */
  subMonthly(sub) { const d = sub.freq === 'anual' ? 12 : sub.freq === 'trimestral' ? 3 : 1; return Math.floor((sub.amountCents * 2 + d) / (2 * d)); },
  /* Una suscripción pagada con tarjeta en modo "Simple" ya está dentro del pago del resumen:
     se muestra, pero no se suma otra vez. */
  subIsInformative(sub) { return Fin.isCardMethod(sub.method) && S.settings.cardMode === 'simple' && !S.settings.subsCountAnyway; },
  nextSubCharge(sub, from) {
    if (sub.status !== 'activa') return null;
    for (let i = 0; i < 25; i++) { const ym = D.addMonths(D.ym(from), i), d = Fin.subCharge(sub, ym); if (d && d >= from) return d; }
    return null;
  },

  savingsPct(ym) {
    const s = S.settings;
    if (s.savingsPaused) return null;
    return s.savingsOverrides && s.savingsOverrides[ym] != null ? s.savingsOverrides[ym] : s.savingsPct;
  },

  /* Resumen de un mes. Cada total conserva la lista de registros que lo forma (para abrir el detalle). */
  summary(ym) {
    const s = S.settings, hs = holidaySet(), t = today();
    const missing = [];
    // --- Ingresos esperados (proyección) vs. recibidos (reales) ---
    const incomeRows = s.incomeRules.filter(r => r.enabled).map(r => {
      const pd = payDate(r, ym, hs);
      const received = S.incomes.filter(i => i.ruleId === r.id && i.ym === ym);
      if (r.expectedCents == null) missing.push(`Importe habitual de “${r.label}”`);
      return { rule: r, date: pd.date, provisional: pd.provisional, expected: r.expectedCents, currency: r.currency, received };
    });
    const extraIncomes = S.incomes.filter(i => !i.ruleId && i.ym === ym);
    const allReceived = S.incomes.filter(i => i.ym === ym);
    const expectedArs = Money.sum(incomeRows.filter(r => r.currency === 'ARS').map(r => r.expected));
    const receivedArs = Money.sum(allReceived.filter(i => i.currency === 'ARS').map(i => i.amountCents));
    // --- Gastos ---
    const inst = Fin.expenseInstances(ym);
    const detailed = s.cardMode === 'detailed';
    const isSettle = i => detailed && i.category === 'Tarjeta de crédito'; // en modo detallado, el pago cancela saldo: no es consumo
    const counted = inst.filter(i => !isSettle(i));
    inst.forEach(i => { if (i.amountCents == null) missing.push(`Importe de “${i.desc}”`); });
    const sumBy = (arr, st) => Money.sum(arr.filter(i => i.currency === 'ARS' && (!st || i.status === st)).map(i => i.amountCents));
    const spent = { pagado: sumBy(counted, 'pagado'), pendiente: sumBy(counted, 'pendiente'), previsto: sumBy(counted, 'previsto') };
    // --- Suscripciones ---
    const subsMonth = S.subs.filter(x => Fin.subCharge(x, ym)).map(x => ({ sub: x, date: Fin.subCharge(x, ym), informative: Fin.subIsInformative(x) }));
    const subsCounted = subsMonth.filter(x => !x.informative);
    const subsArs = Money.sum(subsCounted.filter(x => x.sub.currency === 'ARS').map(x => x.sub.amountCents));
    const subsUsd = Money.sum(subsMonth.filter(x => x.sub.currency === 'USD').map(x => x.sub.amountCents));
    const subsInfoArs = Money.sum(subsMonth.filter(x => x.informative && x.sub.currency === 'ARS').map(x => x.sub.amountCents));
    // --- Ahorro ---
    const pct = Fin.savingsPct(ym);
    const goal = pct == null ? null : Money.pctOf(expectedArs, pct);
    const saved = S.savings.filter(x => D.ym(x.date) === ym && x.currency === 'ARS');
    const savedArs = Money.sum(saved.map(x => x.amountCents));
    const projectedOut = spent.pagado + spent.pendiente + spent.previsto + subsArs;
    const available = expectedArs - projectedOut - (goal || 0);
    const noData = !incomeRows.length && !inst.length;
    const upcoming = counted.filter(i => i.status !== 'pagado' && i.date >= t && i.currency === 'ARS');
    return {
      ym, incomeRows, extraIncomes, allReceived, expectedArs, receivedArs, inst, counted, spent, subsMonth, subsArs, subsUsd, subsInfoArs,
      pct, goal, saved, savedArs, projectedOut, available, missing, incomplete: missing.length > 0 || !inst.length, noData, upcoming,
      provisional: incomeRows.some(r => r.provisional),
      usdExpenses: Money.sum(counted.filter(i => i.currency === 'USD').map(i => i.amountCents)),
    };
  },
  /* Próximas fechas de cobro (hoy en adelante) para el dashboard / calendario */
  nextPaydays(n = 4) {
    const t = today(), hs = holidaySet(), out = [];
    for (let k = 0; k < 14 && out.length < n + 6; k++) {
      const ym = D.addMonths(D.ym(t), k);
      S.settings.incomeRules.filter(r => r.enabled).forEach(r => { const pd = payDate(r, ym, hs); if (pd.date >= t) out.push({ rule: r, ...pd, ym }); });
    }
    return out.sort((a, b) => a.date.localeCompare(b.date)).slice(0, n);
  },
};

/* =====================================================================
   TRAIN — estadísticas de entrenamiento (fórmulas explícitas)
   ===================================================================== */
const Train = {
  load100: x => Math.round((+x || 0) * 100),
  validSet: (set, unit) => set && set.reps > 0 && set.load != null && set.load > 0 && (set.unit || unit) === unit,
  /* Volumen = Σ (carga × repeticiones) de las series con carga y repeticiones completas en la unidad elegida */
  sessionVolume(sess, unit) {
    let v = 0, n = 0, skipped = 0;
    sess.entries.forEach(e => e.sets.forEach(st => { if (Train.validSet(st, unit)) { v += Train.load100(st.load) * st.reps; n++; } else skipped++; }));
    return { volume: v / 100, sets: n, skipped };
  },
  inPeriod(sess, days) { return !days || D.diff(sess.date, today()) <= days; },
  sessions(days) { return S.sessions.filter(x => Train.inPeriod(x, days)).sort((a, b) => a.date.localeCompare(b.date)); },
  /* Mejor carga registrada (con las repeticiones de esa serie) y evolución por sesión de un ejercicio */
  exerciseStats(exId, days, unit) {
    const pts = []; let best = null, otherUnit = 0;
    Train.sessions(days).forEach(sess => {
      let max = null;
      sess.entries.filter(e => e.exerciseId === exId).forEach(e => e.sets.forEach(st => {
        if (st.load > 0 && st.reps > 0 && (st.unit || unit) !== unit) { otherUnit++; return; }
        if (!Train.validSet(st, unit)) return;
        if (!max || st.load > max.load || (st.load === max.load && st.reps > max.reps)) max = { load: st.load, reps: st.reps };
      }));
      if (max) { pts.push({ date: sess.date, ...max }); if (!best || max.load > best.load || (max.load === best.load && max.reps > best.reps)) best = { ...max, date: sess.date }; }
    });
    return { pts, best, otherUnit };
  },
  frequency(days, unitWeeks = true) {
    const weeks = {};
    Train.sessions(days).forEach(s => { const w = D.startOfWeek(s.date); weeks[w] = (weeks[w] || 0) + 1; });
    const out = [], start = D.startOfWeek(today());
    const n = Math.min(12, Math.max(4, Math.ceil((days || 84) / 7)));
    for (let i = n - 1; i >= 0; i--) { const w = D.add(start, -7 * i); out.push({ week: w, n: weeks[w] || 0 }); }
    return out;
  },
  exName(exId, fallback) { const e = Data.find('exercises', exId); return e ? e.name : (fallback || 'Ejercicio eliminado'); },
  planFor(dow) { const p = S.plan.find(x => x.id === 'plan'); return p && p.days ? p.days[dow] : null; },
};

/* =====================================================================
   BIRTHDAYS — detección de cumpleaños (pura, testeable)
   ===================================================================== */
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const BDAY_PREFIX = /^(cumpleanos de|cumpleanos:|birthday of|birthday:)\s*(.*)$/;
/* Devuelve { status: 'confirmed'|'possible'|null, name }.
   isYearly: true/false/null (null = no se pudo verificar la recurrencia anual). */
function classifyBirthday(ev, isYearly, includeOwn = false) {
  if (!ev) return { status: null };
  const title = ev.summary || '';
  if (ev.eventType === 'birthday') {
    const t = ev.birthdayProperties && ev.birthdayProperties.type;
    if (t === 'birthday') return { status: 'confirmed', name: nameFrom(title) };
    if (t === 'self') return { status: includeOwn ? 'confirmed' : null, name: nameFrom(title), own: true };
    if (!t) return { status: 'possible', name: nameFrom(title) };
    return { status: null }; // anniversary, custom, other: nunca se cuentan como cumpleaños
  }
  if (!(ev.start && ev.start.date)) return { status: null }; // solo eventos de día completo
  const n = norm(title), m = BDAY_PREFIX.exec(n);
  if (m) {
    if (m[2] && isYearly === true) return { status: 'confirmed', name: nameFrom(title) };
    return { status: 'possible', name: nameFrom(title) };
  }
  if (n === 'cumpleanos' || n === 'birthday') return { status: 'possible', name: title };
  return { status: null }; // "fiesta de cumpleaños", regalos, etc.
}
function nameFrom(title) {
  const t = String(title).trim();
  const m = /^(cumplea[ñn]os de|cumplea[ñn]os:|birthday of|birthday:)\s*(.+)$/i.exec(t);
  return m ? m[2].trim() : t;
}

function nextDue(due, recur) {
  if (!due || !recur) return due;
  if (recur.type === 'daily') return D.add(due, 1);
  if (recur.type === 'weekly') return D.add(due, 7);
  if (recur.type === 'monthly') return D.clampDay(D.addMonths(D.ym(due), 1), +due.slice(8, 10));
  return D.add(due, Math.max(1, recur.every || 1));
}
function recurFromForm(fd) {
  const t = fd.get('recur'); if (!t) return null;
  return { type: t, every: Math.max(1, parseInt(fd.get('every'), 10) || 1) };
}
function taskLists() {
  const t = today(), q = taskUI.q.trim().toLowerCase();
  let all = S.tasks.filter(x => (!taskUI.cat || x.category === taskUI.cat) && (!q || (x.title + ' ' + (x.notes || '')).toLowerCase().includes(q)));
  const open = all.filter(x => !x.done);
  const byPrio = (a, b) => ['alta', 'normal', 'baja'].indexOf(a.priority) - ['alta', 'normal', 'baja'].indexOf(b.priority) || (a.time || '99').localeCompare(b.time || '99') || a.title.localeCompare(b.title);
  return {
    today: open.filter(x => x.due === t).sort(byPrio),

/* =====================================================================
   GRÁFICOS SVG simples (se adaptan al ancho; sin librerías)
   ===================================================================== */
function lineChart(pts, unit = '') {
  if (pts.length < 2) return pts.length === 1 ? html`<p class="small">Un solo registro (${fmtDate(pts[0].x)}: ${fmtNum(pts[0].y)} ${unit}). Con dos o más aparece el gráfico.</p>` : '';
  const W = 320, H = 170, L = 38, R = 10, T = 12, B = 26;
  const t0 = D.parse(pts[0].x).getTime(), t1 = D.parse(pts[pts.length - 1].x).getTime() || t0 + 1;
  let lo = Math.min(...pts.map(p => p.y)), hi = Math.max(...pts.map(p => p.y)); if (lo === hi) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.1; lo -= pad; hi += pad;
  const X = d => L + (t1 === t0 ? 0.5 : (D.parse(d).getTime() - t0) / (t1 - t0)) * (W - L - R), Y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const path = pts.map((p, i) => (i ? 'L' : 'M') + X(p.x).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
  const grid = [0, 0.5, 1].map(f => { const v = lo + (hi - lo) * f, y = Y(v); return `<line class="gr" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text x="${L - 5}" y="${y + 4}" text-anchor="end">${fmtNum(v)}</text>`; }).join('');
  const dots = pts.length <= 40 ? pts.map(p => `<circle class="pt" cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3"/>`).join('') : '';
  return raw(`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de evolución, de ${fmtDate(pts[0].x)} a ${fmtDate(pts[pts.length - 1].x)}: ${fmtNum(pts[0].y)} a ${fmtNum(pts[pts.length - 1].y)} ${unit}">${grid}<path class="ln" d="${path}"/>${dots}
    <text x="${L}" y="${H - 6}">${fmtDate(pts[0].x).slice(0, 5)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${fmtDate(pts[pts.length - 1].x).slice(0, 5)}</text></svg>`);
}
function barChart(bars) {
  const W = 320, H = 130, L = 22, B = 22, T = 14, max = Math.max(1, ...bars.map(b => b.n)), bw = (W - L - 6) / bars.length;
  const b = bars.map((x, i) => { const h = (x.n / max) * (H - T - B), cx = L + i * bw; return `<rect class="bar" x="${(cx + 3).toFixed(1)}" y="${(H - B - h).toFixed(1)}" width="${(bw - 6).toFixed(1)}" height="${h.toFixed(1)}" rx="3"/>${x.n ? `<text x="${(cx + bw / 2).toFixed(1)}" y="${(H - B - h - 3).toFixed(1)}" text-anchor="middle">${x.n}</text>` : ''}`; }).join('');
  return raw(`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sesiones por semana">${b}<text x="${L}" y="${H - 6}">${x0(bars)}</text><text x="${W - 6}" y="${H - 6}" text-anchor="end">${xN(bars)}</text></svg>`);
}
const x0 = b => fmtDate(b[0].week).slice(0, 5), xN = b => fmtDate(b[b.length - 1].week).slice(0, 5);
const fmtNum = n => new Intl.NumberFormat('es-AR', { maximumFractionDigits: 1 }).format(Math.round(n * 100) / 100);

/* =====================================================================
   ENTRENAMIENTO
   ===================================================================== */
const trainUI = { tab: 'today', exId: '', hist: '' };
const WEEK_ORDER = [1, 2, 3, 4, 5, 6, 0];

/* ----- Racha de entrenamiento -----
   Día “previsto” = el plan tiene ejercicios ese día de la semana; si todavía no hay plan armado, de lunes a viernes.
   · Entrenar un día previsto suma 1 a la racha.
   · Entrenar un día NO previsto (p. ej. sábado o domingo) suma 1 de más y nunca la corta.
   · Un día previsto ya pasado sin sesión corta la racha. Un día no previsto sin sesión no la corta.
   · Hoy, si todavía no entrenaste, no corta: la racha se evalúa al terminar el día. */
Train.hasPlan = () => { const p = S.plan.find(x => x.id === 'plan'); return !!(p && p.days && Object.values(p.days).some(d => d && d.ex && d.ex.length)); };
Train.scheduled = d => { const dow = D.dow(d); if (Train.hasPlan()) { const x = Train.planFor(dow); return !!(x && x.ex && x.ex.length); } return dow >= 1 && dow <= 5; };
Train.streakInfo = (t = today()) => {
  const days = new Set(S.sessions.map(x => x.date)), sorted = [...days].sort(), first = sorted[0];
  const info = { current: 0, best: 0, bonus: 0, total: S.sessions.length, extraTotal: 0, trainedToday: days.has(t), pendingToday: Train.scheduled(t) && !days.has(t), first: first || null };
  if (!first) return info;
  for (let d = t; d >= first; d = D.add(d, -1)) {
    if (days.has(d)) { info.current++; if (!Train.scheduled(d)) info.bonus++; }
    else if (Train.scheduled(d) && d !== t) break;
  }
  let run = 0;
  for (let d = first; d <= t; d = D.add(d, 1)) {
    if (days.has(d)) { run++; info.best = Math.max(info.best, run); if (!Train.scheduled(d)) info.extraTotal++; }
    else if (Train.scheduled(d) && d !== t) run = 0;
  }
  return info;
};
Train.weekStates = (t = today()) => {
  const ws = D.startOfWeek(t), days = new Set(S.sessions.map(x => x.date));
  return [0, 1, 2, 3, 4, 5, 6].map(i => { const d = D.add(ws, i), sch = Train.scheduled(d), done = days.has(d);
    const state = done ? (sch ? 'done' : 'bonus') : d > t ? (sch ? 'upcoming' : 'rest') : d === t ? (sch ? 'today' : 'rest') : (sch ? 'missed' : 'rest');
    return { date: d, dow: D.dow(d), state }; });
};
const BADGES = [['s1', 'Primera sesión', 'total', 1], ['s10', '10 sesiones', 'total', 10], ['s25', '25 sesiones', 'total', 25], ['s50', '50 sesiones', 'total', 50], ['s100', '100 sesiones', 'total', 100],
  ['r3', 'Racha de 3', 'streak', 3], ['r7', 'Racha de 7', 'streak', 7], ['r14', 'Racha de 14', 'streak', 14], ['r30', 'Racha de 30', 'streak', 30], ['r60', 'Racha de 60', 'streak', 60]];
const LEVELS = [[0, 'Arrancando'], [5, 'Tomando ritmo'], [15, 'Constante'], [35, 'Firme'], [75, 'Imparable'], [150, 'Leyenda']];
Train.badges = (i = Train.streakInfo()) => BADGES.map(([k, label, kind, n]) => ({ k, label, kind, n, earned: (kind === 'total' ? i.total : i.best) >= n, left: Math.max(0, n - (kind === 'total' ? i.total : i.best)) }));

    await upd(d => { if (k === 'rm') d.ex.splice(i, 1); if (k === 'up' && i > 0) [d.ex[i - 1], d.ex[i]] = [d.ex[i], d.ex[i - 1]]; if (k === 'dn' && i < d.ex.length - 1) [d.ex[i + 1], d.ex[i]] = [d.ex[i], d.ex[i + 1]]; }); });

/* ----- Estadísticas ----- */
function trainStats() {
  const days = S.settings.trainPeriod, u = unitLbl(), sess = Train.sessions(days);
  const exIds = [...new Set(S.sessions.flatMap(s => s.entries.map(e => e.exerciseId)))];
  if (!S.sessions.length) return emptyState('Todavía no hay estadísticas', 'Se calculan con las sesiones que registres. Nada se estima ni se inventa.', 'train-goto-today', 'Registrar una sesión');
  const exId = trainUI.exId || exIds[0], st = Train.exerciseStats(exId, days, u);
  const vols = sess.map(s => ({ x: s.date, y: Train.sessionVolume(s, u).volume })).filter(v => v.y > 0);
  const weeks = Math.max(1, (days || Math.max(7, D.diff(S.sessions.map(s => s.date).sort()[0], today()))) / 7);
  const skipped = sess.reduce((a, s) => a + Train.sessionVolume(s, u).skipped, 0);
  return html`<div class="stack">
    <label class="field"><span>Período</span><select data-sel="period">${opts([[30, 'Últimos 30 días'], [90, 'Últimos 90 días'], [365, 'Último año'], [0, 'Todo el historial']], days)}</select></label>
    <div class="card"><h3>Frecuencia</h3><div class="big tnum">${sess.length} <span class="sub" style="font-size:15px;font-weight:500">sesiones · ${fmtNum(sess.length / weeks)} por semana</span></div>${barChart(Train.frequency(days))}
      <p class="small">Cuenta sesiones guardadas dentro del período; el promedio divide por las semanas del período.</p></div>
    <div class="card"><h3>Volumen por sesión</h3>${vols.length ? html`${lineChart(vols, u)}` : html`<p class="sub">Sin series con carga y repeticiones completas en ${u}.</p>`}
      <p class="small">Volumen = suma de (carga × repeticiones) de cada serie con carga y repeticiones completas en ${u}. Las series sin carga o en otra unidad se excluyen${skipped ? ` (${skipped} excluidas en este período)` : ''}. No mide fuerza ni músculo.</p></div>
    <div class="card"><h3>Evolución por ejercicio</h3><label class="field"><span>Ejercicio</span><select data-sel="stat-ex">${opts(exIds.map(id => [id, Train.exName(id)]), exId)}</select></label>
      <div style="margin-top:10px">${st.best ? html`<div class="big tnum">${fmtNum(st.best.load)} ${u} <span class="sub" style="font-size:15px;font-weight:500">× ${st.best.reps} reps · ${fmtDate(st.best.date)}</span></div><p class="small">Mejor carga registrada (la serie con mayor ${u}; si empata, con más repeticiones).</p>${lineChart(st.pts.map(p => ({ x: p.date, y: p.load })), u)}`
        : html`<p class="sub">Este ejercicio no tiene series con carga en ${u} dentro del período.</p>`}
      ${st.otherUnit ? html`<p class="small">Se excluyeron ${st.otherUnit} series registradas en otra unidad para no mezclar kg y lb.</p>` : ''}
      <p class="small">El gráfico muestra la mayor carga de cada sesión.</p></div></div></div>`;
}

document.addEventListener('submit', async e => {

/* =====================================================================
   GCAL — integración con Google Calendar API v3 + Google Identity Services.
   - Solo OAuth de navegador (token efímero EN MEMORIA). Sin client secret, sin API key privada.
   - Alcance mínimo: calendar.events (leer, crear y editar eventos).
   - El script de Google solo se carga cuando tocás “Conectar”.
   ===================================================================== */
const GSCOPE = 'https://www.googleapis.com/auth/calendar.events';
const GAPI = 'https://www.googleapis.com/calendar/v3';
const GCal = {
  token: null, tokenExp: 0, tokenClient: null, state: 'idle', lastError: null, masters: {},
  clientId() { return String(S.settings.gClientId || (window.APP_CONFIG && window.APP_CONFIG.GOOGLE_CLIENT_ID) || '').trim(); },
  originOk() { return location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1'; },
  connected() { return !!GCal.token && Date.now() < GCal.tokenExp; },
  /* Estado verdadero para la UI: nunca se simula una conexión */
  status() {
    if (!GCal.clientId()) return { k: 'unconfigured', tone: 'warn', text: 'Google Calendar todavía no conectado', detail: 'Falta cargar el OAuth Client ID (Ajustes → Google Calendar).' };
    if (!GCal.originOk()) return { k: 'origin', tone: 'warn', text: 'Google Calendar no disponible desde acá', detail: `Esta dirección (${location.protocol}//${location.host || 'archivo local'}) no sirve para conectar: hace falta HTTPS o localhost.` };
    if (GCal.state === 'connecting') return { k: 'connecting', tone: 'info', text: 'Conectando con Google…', detail: 'Completá la autorización en la ventana de Google.' };
    if (GCal.state === 'syncing') return { k: 'syncing', tone: 'info', text: 'Sincronizando…', detail: '' };

/* =====================================================================
   CALENDARIO — vistas, eventos, cumpleaños
   ===================================================================== */
const calUI = { mode: 'month', date: null, sel: null };
const calDate = () => calUI.date || (calUI.date = today());

/* Elementos de un rango: eventos de Google (caché) + tareas con fecha + recordatorios de cobro calculados.
   Los de Google y los propios de la app se distinguen en pantalla. */
function calItems(from, to) {
  const out = [];
  S.gevents.forEach(e => {
    if (e.status === 'cancelled') return;
    if (e.allDay) { const s = e.start.date, en = e.end.date || D.add(s, 1); for (let d = s; d < en && d <= to; d = D.add(d, 1)) if (d >= from) out.push({ kind: 'g', date: d, allDay: true, time: '', title: e.title, sub: e.eventType === 'birthday' ? 'Cumpleaños' : '', ev: e }); }
    else { const d = (e.start.dateTime || '').slice(0, 10); if (d >= from && d <= to) out.push({ kind: 'g', date: d, allDay: false, time: e.start.dateTime.slice(11, 16), end: (e.end.dateTime || '').slice(11, 16), title: e.title, sub: e.location, ev: e }); }
  });
  S.tasks.filter(x => !x.done && x.due && x.due >= from && x.due <= to).forEach(x => out.push({ kind: 'task', date: x.due, allDay: !x.time, time: x.time || '', title: x.title, sub: 'Tarea', task: x }));

const Backup = {
  build() {

    return { app: 'mi-panel', schemaVersion: SCHEMA_VERSION, appVersion: APP_VERSION, exportedAt: nowIso(), data };
  },
  cleanSettings() { const c = JSON.parse(JSON.stringify(S.settings)); delete c.gAccount; c.gEverConnected = false; c.gLastSync = null; return c; }, // nunca hay tokens; además se quita la cuenta
  download(name, text, type = 'application/json') {
    const a = document.createElement('a'), url = URL.createObjectURL(new Blob([text], { type }));
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
  },
  exportJson() { Backup.download(`mi-panel-respaldo-${today()}.json`, JSON.stringify(Backup.build(), null, 1)); Data.saveSettings({ lastBackupAt: nowIso() }); UI.toast('Respaldo descargado'); },
  /* Validación completa antes de tocar los datos actuales */
  validate(obj) {

    if (!Number.isInteger(obj.schemaVersion) || obj.schemaVersion > SCHEMA_VERSION) return { ok: false, errors: ['El respaldo es de una versión más nueva de la app (' + obj.schemaVersion + '). Actualizá Mi Panel primero.'] };
    if (!obj.data || typeof obj.data !== 'object') return { ok: false, errors: ['El respaldo no tiene datos.'] };
    const counts = {};
    for (const s of BACKUP_STORES) {
      const arr = obj.data[s]; if (arr == null) { counts[s] = 0; continue; }
      if (!Array.isArray(arr)) { errors.push(`“${s}” tiene un formato inválido.`); continue; }
      counts[s] = arr.length; const ids = new Set();
      arr.forEach((r, i) => {
        if (!r || typeof r !== 'object' || typeof r.id !== 'string' || !r.id) return errors.push(`${s}[${i}]: falta el identificador.`);

const countUp = animated => {
  if (!animated || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  document.querySelectorAll('#view [data-count]').forEach(el => { const to = +el.dataset.count; if (!(to > 0)) return; const t0 = performance.now(), dur = 800;
    const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(to * e); if (k < 1) requestAnimationFrame(step); else el.textContent = to; }; el.textContent = 0; requestAnimationFrame(step); });
};

  if (!('serviceWorker' in navigator) || !(location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) return;
  const hadController = !!navigator.serviceWorker.controller; // en la 1.ª instalación no se recarga: solo al aceptar una actualización
  navigator.serviceWorker.register('sw.js').then(reg => {
    const ask = w => UI.toast('Hay una versión nueva de Mi Panel.', { sticky: true, action: { label: 'Actualizar', fn: () => w.postMessage({ type: 'SKIP_WAITING' }) } });
    if (reg.waiting && navigator.serviceWorker.controller) ask(reg.waiting);
    reg.addEventListener('updatefound', () => { const w = reg.installing; if (w) w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) ask(w); }); });
    setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
  }).catch(e => console.warn('SW no registrado:', e && e.message));
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloaded || !hadController) return; reloaded = true; location.reload(); });
}

(async () => {

  await Data.init();
  UI.applyTheme(); UI.render(); registerSW();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;

    UI.render(); // refresca “hoy” si cambió el día
  });
  window.addEventListener('unhandledrejection', e => console.warn('Promesa sin manejar:', e.reason && e.reason.message));

})();
